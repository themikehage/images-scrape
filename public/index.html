<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Scraper - Bing</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --text: #f1f5f9;
      --text-2: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --error: #ef4444;
      --border: #475569;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container { max-width: 1200px; width: 100%; }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      color: var(--text-2);
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .form-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .form-group {
      flex: 1;
      min-width: 250px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-2);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 0.65rem 1.5rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--text-2);
      margin-top: 0.5rem;
    }

    .loading { display: none; }
    .loading.active { display: flex; align-items: center; gap: 0.75rem; padding: 2rem; justify-content: center; }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid var(--surface-2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      color: var(--error);
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .error-msg.active { display: block; }

    .result-section { margin-top: 1.5rem; }
    .result-section h2 {
      font-size: 1.15rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .result-section h2 span { color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .image-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }
    .image-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .image-card .img-wrap {
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: var(--surface-2);
      position: relative;
    }
    .image-card .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .image-card .img-wrap .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-2);
      font-size: 0.8rem;
    }

    .image-card .info {
      padding: 0.65rem;
    }
    .image-card .info .title {
      font-size: 0.8rem;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 0.3rem;
    }
    .image-card .info .dims {
      font-size: 0.7rem;
      color: var(--text-2);
    }

    .error-badge {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      color: var(--error);
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 640px) {
      .form-row { flex-direction: column; }
      .form-group { min-width: auto; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Image Scraper</h1>
    <p class="subtitle">Busca imágenes en Bing Image Search desde el worker</p>

    <div class="card">
      <div class="form-row">
        <div class="form-group">
          <label for="queries">Términos de búsqueda (separados por coma)</label>
          <input type="text" id="queries" placeholder="roma, parís, tokio" value="roma">
        </div>
        <div class="form-group" style="min-width:100px;flex:0 1 100px;">
          <label for="limit">Límite</label>
          <input type="number" id="limit" value="12" min="1" max="50">
        </div>
        <button class="btn" id="scrapeBtn" onclick="scrape()">Buscar</button>
      </div>
      <p class="hint">Url del worker: <span id="workerUrl"></span></p>
    </div>

    <div id="error" class="error-msg"></div>
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <span>Buscando imágenes...</span>
    </div>
    <div id="results"></div>
  </div>

  <script>
    const API = '/api/scrape';

    document.getElementById('workerUrl').textContent = window.location.origin;
    document.getElementById('queries').addEventListener('keydown', e => { if (e.key === 'Enter') scrape(); });
    document.getElementById('limit').addEventListener('keydown', e => { if (e.key === 'Enter') scrape(); });

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.add('active');
    }

    function hideError() {
      document.getElementById('error').classList.remove('active');
    }

    function setLoading(v) {
      document.getElementById('loading').classList.toggle('active', v);
      document.getElementById('scrapeBtn').disabled = v;
    }

    function buildCard(img) {
      const dims = img.width && img.height ? `${img.width} × ${img.height}` : '';
      return `
        <div class="image-card">
          <div class="img-wrap">
            <img src="${img.thumbnail}" alt="${img.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=placeholder>Error al cargar</div>'">
          </div>
          <div class="info">
            <div class="title">${img.title}</div>
            ${dims ? `<div class="dims">${dims}</div>` : ''}
          </div>
        </div>
      `;
    }

    async function scrape() {
      hideError();
      const input = document.getElementById('queries');
      const limit = parseInt(document.getElementById('limit').value) || 12;
      const queries = input.value.split(',').map(q => q.trim()).filter(Boolean);

      if (queries.length === 0) {
        showError('Ingresa al menos un término de búsqueda');
        return;
      }

      setLoading(true);
      document.getElementById('results').innerHTML = '';

      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ queries, limit }),
        });

        const data = await res.json();

        if (!data.success) {
          showError(data.error || 'Error del servidor');
          return;
        }

        let html = '';
        for (const result of data.results) {
          html += `<div class="result-section">`;
          html += `<h2><span>${result.query}</span> — ${result.images.length} imágenes</h2>`;

          if (result.error) {
            html += `<div class="error-badge">${result.error}</div>`;
          }

          if (result.images.length > 0) {
            html += `<div class="grid">`;
            for (const img of result.images) {
              html += buildCard(img);
            }
            html += `</div>`;
          } else if (!result.error) {
            html += `<p style="color:var(--text-2)">No se encontraron imágenes</p>`;
          }

          html += `</div>`;
        }

        document.getElementById('results').innerHTML = html;
      } catch (err) {
        showError('Error de conexión: ' + err.message);
      } finally {
        setLoading(false);
      }
    }

    scrape();
  </script>
</body>
</html>
